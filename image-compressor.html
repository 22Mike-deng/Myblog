<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片压缩器 - 工具箱</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    .tool-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: var(--spacing-lg);
    }
    
    .tool-header {
      text-align: center;
      margin-bottom: var(--spacing-xl);
    }
    
    .tool-title {
      font-size: 1.5rem;
      color: var(--color-accent);
      margin-bottom: var(--spacing-sm);
    }
    
    .tool-subtitle {
      color: var(--color-text-dim);
      font-size: 0.875rem;
    }
    
    .upload-area {
      border: 3px dashed var(--color-card-border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-xl);
      text-align: center;
      background: var(--color-bg-panel);
      transition: all 0.3s;
      margin-bottom: var(--spacing-lg);
    }
    
    .upload-area:hover,
    .upload-area.dragover {
      border-color: var(--color-accent);
      background: rgba(255, 105, 180, 0.05);
    }
    
    .upload-icon {
      font-size: 3rem;
      margin-bottom: var(--spacing-md);
    }
    
    .upload-text {
      color: var(--color-text);
      margin-bottom: var(--spacing-sm);
    }
    
    .upload-hint {
      color: var(--color-text-dim);
      font-size: 0.75rem;
    }
    
    .upload-input {
      display: none;
    }
    
    .compressor-workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-lg);
      margin-bottom: var(--spacing-lg);
    }
    
    @media (max-width: 768px) {
      .compressor-workspace {
        grid-template-columns: 1fr;
      }
    }
    
    .image-panel {
      background: var(--color-bg-panel);
      border: 2px solid var(--color-card-border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    
    .panel-header {
      background: var(--color-bg-dark);
      padding: var(--spacing-sm) var(--spacing-md);
      border-bottom: 2px solid var(--color-card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .panel-title {
      font-size: 0.875rem;
      color: var(--color-text);
    }
    
    .file-info {
      font-size: 0.75rem;
      color: var(--color-text-dim);
    }
    
    .image-preview {
      width: 100%;
      min-height: 300px;
      max-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-bg-dark);
      position: relative;
      overflow: hidden;
    }
    
    .image-preview img {
      max-width: 100%;
      max-height: 400px;
      object-fit: contain;
    }
    
    .image-placeholder {
      color: var(--color-text-dim);
      font-size: 0.875rem;
    }
    
    .quality-control {
      background: var(--color-bg-panel);
      border: 2px solid var(--color-card-border);
      border-radius: var(--radius-md);
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-lg);
    }
    
    .quality-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-md);
    }
    
    .quality-label {
      font-size: 0.875rem;
      color: var(--color-text);
    }
    
    .quality-value {
      font-size: 1.25rem;
      color: var(--color-accent);
      font-weight: bold;
    }
    
    .quality-slider {
      width: 100%;
      height: 8px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--color-bg-dark);
      border-radius: 4px;
      outline: none;
      margin-bottom: var(--spacing-md);
    }
    
    .quality-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      background: var(--color-accent);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: var(--shadow-pixel);
    }
    
    .quality-slider::-moz-range-thumb {
      width: 20px;
      height: 20px;
      background: var(--color-accent);
      border-radius: 50%;
      cursor: pointer;
      border: none;
      box-shadow: var(--shadow-pixel);
    }
    
    .compression-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--spacing-md);
      text-align: center;
    }
    
    .info-item {
      background: var(--color-bg-dark);
      padding: var(--spacing-md);
      border-radius: var(--radius-sm);
    }
    
    .info-label {
      font-size: 0.75rem;
      color: var(--color-text-dim);
      margin-bottom: var(--spacing-xs);
    }
    
    .info-value {
      font-size: 1rem;
      color: var(--color-text);
      font-weight: bold;
    }
    
    .info-value.saving {
      color: #2ed573;
    }
    
    .tool-actions {
      display: flex;
      justify-content: center;
      gap: var(--spacing-md);
      flex-wrap: wrap;
    }
    
    .action-btn {
      background: var(--color-accent);
      color: white;
      border: none;
      padding: var(--spacing-sm) var(--spacing-lg);
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
    }
    
    .action-btn:hover {
      background: var(--color-accent-hover);
      transform: translateY(-2px);
    }
    
    .action-btn:disabled {
      background: var(--color-card-border);
      cursor: not-allowed;
      transform: none;
    }
    
    .action-btn.secondary {
      background: var(--color-bg-panel);
      border: 2px solid var(--color-card-border);
      color: var(--color-text);
    }
    
    .action-btn.secondary:hover {
      background: var(--color-card-border);
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="avatar-container" id="avatarContainer">
          <img src="images/avatar.png" alt="头像" class="avatar" id="avatarImg" onerror="this.style.display='none'">
        </div>
        <nav class="nav-menu">
          <a href="index.html" class="nav-item">📝 文章</a>
          <a href="aigc.html" class="nav-item">🎨 AIGC</a>
          <a href="aivideo.html" class="nav-item">📹 AIVideo</a>
          <a href="bookmarks.html" class="nav-item">🔖 书签</a>
          <a href="tools.html" class="nav-item active">🛠️ 工具箱</a>
        </nav>
        <h1 class="site-title">工具箱</h1>
        <p class="site-subtitle">图片压缩器</p>
      </div>

      <div class="about-section">
        <h3 class="sidebar-title">关于</h3>
        <p class="about-text">压缩图片文件大小，支持质量调整</p>
      </div>

      <footer class="sidebar-footer">
        <p>&copy; 2026 我的个人博客</p>
      </footer>
    </aside>

    <main class="main-content">
      <header class="content-header">
        <h2 class="content-title">🖼️ 图片压缩器</h2>
        <a href="tools.html" class="back-link">← 返回工具箱</a>
      </header>

      <div class="tool-container">
        <div class="tool-header">
          <h2 class="tool-title">🖼️ 图片压缩器</h2>
          <p class="tool-subtitle">压缩图片文件大小，支持质量调整和实时预览对比</p>
        </div>

        <div class="upload-area" id="uploadArea">
          <div class="upload-icon">📁</div>
          <div class="upload-text">点击或拖拽图片到此处</div>
          <div class="upload-hint">支持 JPG、PNG、WebP 格式</div>
          <input type="file" class="upload-input" id="fileInput" accept="image/*">
        </div>

        <div class="compressor-workspace" id="workspace" style="display: none;">
          <div class="image-panel">
            <div class="panel-header">
              <span class="panel-title">原图</span>
              <span class="file-info" id="originalInfo">-</span>
            </div>
            <div class="image-preview">
              <img id="originalImage" alt="原图预览">
            </div>
          </div>

          <div class="image-panel">
            <div class="panel-header">
              <span class="panel-title">压缩后</span>
              <span class="file-info" id="compressedInfo">-</span>
            </div>
            <div class="image-preview">
              <img id="compressedImage" alt="压缩后预览">
            </div>
          </div>
        </div>

        <div class="quality-control" id="qualityControl" style="display: none;">
          <div class="quality-header">
            <span class="quality-label">压缩质量</span>
            <span class="quality-value" id="qualityValue">80%</span>
          </div>
          <input type="range" class="quality-slider" id="qualitySlider" min="1" max="100" value="80">
          
          <div class="compression-info">
            <div class="info-item">
              <div class="info-label">原图大小</div>
              <div class="info-value" id="originalSize">-</div>
            </div>
            <div class="info-item">
              <div class="info-label">压缩后</div>
              <div class="info-value" id="compressedSize">-</div>
            </div>
            <div class="info-item">
              <div class="info-label">节省空间</div>
              <div class="info-value saving" id="savingPercent">-</div>
            </div>
          </div>
        </div>

        <div class="tool-actions">
          <button class="action-btn" id="downloadBtn" disabled onclick="downloadImage()">
            💾 下载压缩图片
          </button>
          <button class="action-btn secondary" onclick="resetCompressor()">
            🔄 重新选择
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const workspace = document.getElementById('workspace');
    const qualityControl = document.getElementById('qualityControl');
    const qualitySlider = document.getElementById('qualitySlider');
    const qualityValue = document.getElementById('qualityValue');
    const originalImage = document.getElementById('originalImage');
    const compressedImage = document.getElementById('compressedImage');
    const downloadBtn = document.getElementById('downloadBtn');

    let originalFile = null;
    let compressedDataUrl = null;

    // 点击上传
    uploadArea.addEventListener('click', () => fileInput.click());

    // 文件选择
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) handleFile(file);
    });

    // 拖拽上传
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        handleFile(file);
      }
    });

    // 处理文件
    function handleFile(file) {
      originalFile = file;
      
      // 显示原图信息
      document.getElementById('originalInfo').textContent = 
        `${file.name} (${file.type.split('/')[1].toUpperCase()})`;
      document.getElementById('originalSize').textContent = formatFileSize(file.size);

      // 读取并显示原图
      const reader = new FileReader();
      reader.onload = (e) => {
        originalImage.src = e.target.result;
        compressImage(e.target.result, qualitySlider.value / 100);
      };
      reader.readAsDataURL(file);

      // 显示工作区
      uploadArea.style.display = 'none';
      workspace.style.display = 'grid';
      qualityControl.style.display = 'block';
      downloadBtn.disabled = false;
    }

    // 压缩图片
    function compressImage(dataUrl, quality) {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);

        // 根据原图类型选择输出格式
        let outputType = originalFile.type;
        if (outputType === 'image/png' && quality < 1) {
          outputType = 'image/jpeg';
        }

        compressedDataUrl = canvas.toDataURL(outputType, quality);
        compressedImage.src = compressedDataUrl;

        // 计算压缩后大小
        const compressedSize = Math.round((compressedDataUrl.length - 22) * 3 / 4);
        document.getElementById('compressedSize').textContent = formatFileSize(compressedSize);

        // 计算节省比例
        const saving = ((originalFile.size - compressedSize) / originalFile.size * 100).toFixed(1);
        document.getElementById('savingPercent').textContent = saving + '%';
        document.getElementById('compressedInfo').textContent = 
          `${img.width} x ${img.height} px`;
      };
      img.src = dataUrl;
    }

    // 质量滑块变化
    qualitySlider.addEventListener('input', (e) => {
      const quality = e.target.value;
      qualityValue.textContent = quality + '%';
      if (originalImage.src) {
        compressImage(originalImage.src, quality / 100);
      }
    });

    // 格式化文件大小
    function formatFileSize(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // 下载压缩图片
    function downloadImage() {
      if (!compressedDataUrl) return;
      
      const link = document.createElement('a');
      link.download = 'compressed_' + originalFile.name.replace(/\.[^/.]+$/, '') + '.jpg';
      link.href = compressedDataUrl;
      link.click();
    }

    // 重置
    function resetCompressor() {
      originalFile = null;
      compressedDataUrl = null;
      originalImage.src = '';
      compressedImage.src = '';
      fileInput.value = '';
      qualitySlider.value = 80;
      qualityValue.textContent = '80%';
      
      uploadArea.style.display = 'block';
      workspace.style.display = 'none';
      qualityControl.style.display = 'none';
      downloadBtn.disabled = true;
      
      document.getElementById('originalInfo').textContent = '-';
      document.getElementById('compressedInfo').textContent = '-';
      document.getElementById('originalSize').textContent = '-';
      document.getElementById('compressedSize').textContent = '-';
      document.getElementById('savingPercent').textContent = '-';
    }
  </script>
</body>
</html>
