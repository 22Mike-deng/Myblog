<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON 格式化工具 - 工具箱</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    .tool-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: var(--spacing-lg);
    }
    
    .tool-header {
      text-align: center;
      margin-bottom: var(--spacing-xl);
    }
    
    .tool-title {
      font-size: 1.5rem;
      color: var(--color-accent);
      margin-bottom: var(--spacing-sm);
    }
    
    .tool-subtitle {
      color: var(--color-text-dim);
      font-size: 0.875rem;
    }
    
    .json-workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-lg);
      margin-bottom: var(--spacing-lg);
    }
    
    @media (max-width: 768px) {
      .json-workspace {
        grid-template-columns: 1fr;
      }
    }
    
    .json-panel {
      background: var(--color-bg-panel);
      border: 2px solid var(--color-card-border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    
    .panel-header {
      background: var(--color-bg-dark);
      padding: var(--spacing-sm) var(--spacing-md);
      border-bottom: 2px solid var(--color-card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .panel-title {
      font-size: 0.875rem;
      color: var(--color-text);
    }
    
    .panel-actions {
      display: flex;
      gap: var(--spacing-xs);
    }
    
    .panel-btn {
      background: var(--color-bg-panel);
      border: 1px solid var(--color-card-border);
      color: var(--color-text-dim);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .panel-btn:hover {
      background: var(--color-accent);
      color: white;
      border-color: var(--color-accent);
    }
    
    .json-textarea {
      width: 100%;
      min-height: 400px;
      padding: var(--spacing-md);
      background: var(--color-bg-dark);
      border: none;
      color: var(--color-text);
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.875rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
    }
    
    .json-output {
      width: 100%;
      min-height: 400px;
      padding: var(--spacing-md);
      background: var(--color-bg-dark);
      color: var(--color-text);
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.875rem;
      line-height: 1.6;
      overflow-x: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    
    .json-string { color: #a8ff60; }
    .json-number { color: #ff8c69; }
    .json-boolean { color: #ff79c6; }
    .json-null { color: #ff79c6; }
    .json-key { color: #8be9fd; }
    
    .error-message {
      background: rgba(255, 71, 87, 0.1);
      border: 1px solid var(--color-error);
      color: var(--color-error);
      padding: var(--spacing-md);
      border-radius: var(--radius-md);
      margin-top: var(--spacing-md);
      display: none;
    }
    
    .error-message.show {
      display: block;
    }
    
    .tool-actions {
      display: flex;
      justify-content: center;
      gap: var(--spacing-md);
      flex-wrap: wrap;
    }
    
    .action-btn {
      background: var(--color-accent);
      color: white;
      border: none;
      padding: var(--spacing-sm) var(--spacing-lg);
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
    }
    
    .action-btn:hover {
      background: var(--color-accent-hover);
      transform: translateY(-2px);
    }
    
    .action-btn.secondary {
      background: var(--color-bg-panel);
      border: 2px solid var(--color-card-border);
      color: var(--color-text);
    }
    
    .action-btn.secondary:hover {
      background: var(--color-card-border);
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="avatar-container" id="avatarContainer">
          <img src="images/avatar.png" alt="头像" class="avatar" id="avatarImg" onerror="this.style.display='none'">
        </div>
        <nav class="nav-menu">
          <a href="index.html" class="nav-item">📝 文章</a>
          <a href="aigc.html" class="nav-item">🎨 AIGC</a>
          <a href="aivideo.html" class="nav-item">📹 AIVideo</a>
          <a href="bookmarks.html" class="nav-item">🔖 书签</a>
          <a href="tools.html" class="nav-item active">🛠️ 工具箱</a>
        </nav>
        <h1 class="site-title">工具箱</h1>
        <p class="site-subtitle">JSON 格式化工具</p>
      </div>

      <div class="about-section">
        <h3 class="sidebar-title">关于</h3>
        <p class="about-text">格式化、压缩、验证 JSON 数据</p>
      </div>

      <footer class="sidebar-footer">
        <p>&copy; 2026 我的个人博客</p>
      </footer>
    </aside>

    <main class="main-content">
      <header class="content-header">
        <h2 class="content-title">📄 JSON 格式化工具</h2>
        <a href="tools.html" class="back-link">← 返回工具箱</a>
      </header>

      <div class="tool-container">
        <div class="tool-header">
          <h2 class="tool-title">📄 JSON 格式化工具</h2>
          <p class="tool-subtitle">格式化、压缩、验证 JSON 数据，支持语法高亮</p>
        </div>

        <div class="json-workspace">
          <div class="json-panel">
            <div class="panel-header">
              <span class="panel-title">输入 JSON</span>
              <div class="panel-actions">
                <button class="panel-btn" onclick="clearInput()">清空</button>
                <button class="panel-btn" onclick="pasteExample()">示例</button>
              </div>
            </div>
            <textarea 
              class="json-textarea" 
              id="jsonInput" 
              placeholder="在此粘贴 JSON 数据..."
            ></textarea>
          </div>

          <div class="json-panel">
            <div class="panel-header">
              <span class="panel-title">输出结果</span>
              <div class="panel-actions">
                <button class="panel-btn" onclick="copyOutput()">复制</button>
              </div>
            </div>
            <div class="json-output" id="jsonOutput">
              <span style="color: var(--color-text-dim);">结果将显示在这里...</span>
            </div>
          </div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="tool-actions">
          <button class="action-btn" onclick="formatJSON()">
            ✨ 格式化
          </button>
          <button class="action-btn secondary" onclick="compressJSON()">
            🗜️ 压缩
          </button>
          <button class="action-btn secondary" onclick="validateJSON()">
            ✅ 验证
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    const jsonInput = document.getElementById('jsonInput');
    const jsonOutput = document.getElementById('jsonOutput');
    const errorMessage = document.getElementById('errorMessage');

    // 格式化 JSON
    function formatJSON() {
      const input = jsonInput.value.trim();
      if (!input) {
        showError('请输入 JSON 数据');
        return;
      }

      try {
        const parsed = JSON.parse(input);
        const formatted = JSON.stringify(parsed, null, 2);
        jsonOutput.innerHTML = syntaxHighlight(formatted);
        hideError();
      } catch (e) {
        showError('JSON 格式错误: ' + e.message);
      }
    }

    // 压缩 JSON
    function compressJSON() {
      const input = jsonInput.value.trim();
      if (!input) {
        showError('请输入 JSON 数据');
        return;
      }

      try {
        const parsed = JSON.parse(input);
        const compressed = JSON.stringify(parsed);
        jsonOutput.innerHTML = syntaxHighlight(compressed);
        hideError();
      } catch (e) {
        showError('JSON 格式错误: ' + e.message);
      }
    }

    // 验证 JSON
    function validateJSON() {
      const input = jsonInput.value.trim();
      if (!input) {
        showError('请输入 JSON 数据');
        return;
      }

      try {
        JSON.parse(input);
        jsonOutput.innerHTML = '<span style="color: #2ed573;">✅ JSON 格式正确</span>';
        hideError();
      } catch (e) {
        showError('JSON 格式错误: ' + e.message);
      }
    }

    // 语法高亮
    function syntaxHighlight(json) {
      json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return json.replace(
        /("(?:\\"|[^"])*")(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g,
        function(match, string, colon, boolean) {
          if (colon) {
            return '<span class="json-key">' + string + '</span>' + colon;
          }
          if (string) {
            return '<span class="json-string">' + string + '</span>';
          }
          if (boolean) {
            return '<span class="json-' + (boolean === 'null' ? 'null' : 'boolean') + '">' + match + '</span>';
          }
          return '<span class="json-number">' + match + '</span>';
        }
      );
    }

    // 清空输入
    function clearInput() {
      jsonInput.value = '';
      jsonOutput.innerHTML = '<span style="color: var(--color-text-dim);">结果将显示在这里...</span>';
      hideError();
    }

    // 粘贴示例
    function pasteExample() {
      const example = {
        "name": "示例数据",
        "version": "1.0.0",
        "enabled": true,
        "count": 42,
        "items": ["item1", "item2", "item3"],
        "config": {
          "debug": false,
          "timeout": 3000
        }
      };
      jsonInput.value = JSON.stringify(example, null, 2);
      formatJSON();
    }

    // 复制输出
    async function copyOutput() {
      const text = jsonOutput.textContent;
      if (!text || text === '结果将显示在这里...') {
        showError('没有可复制的内容');
        return;
      }

      try {
        await navigator.clipboard.writeText(text);
        const originalText = event.target.textContent;
        event.target.textContent = '已复制';
        setTimeout(() => {
          event.target.textContent = originalText;
        }, 2000);
      } catch (err) {
        showError('复制失败');
      }
    }

    // 显示错误
    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('show');
    }

    // 隐藏错误
    function hideError() {
      errorMessage.classList.remove('show');
    }

    // 实时格式化（输入时）
    let debounceTimer;
    jsonInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        if (jsonInput.value.trim()) {
          formatJSON();
        }
      }, 500);
    });
  </script>
</body>
</html>
