<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>密码生成器 - 工具箱</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    .tool-container {
      max-width: 800px;
      margin: 0 auto;
      padding: var(--spacing-lg);
    }
    
    .tool-header {
      text-align: center;
      margin-bottom: var(--spacing-xl);
    }
    
    .tool-title {
      font-size: 1.5rem;
      color: var(--color-accent);
      margin-bottom: var(--spacing-sm);
    }
    
    .tool-subtitle {
      color: var(--color-text-dim);
      font-size: 0.875rem;
    }
    
    .password-display {
      background: var(--color-bg-panel);
      border: 2px solid var(--color-card-border);
      border-radius: var(--radius-md);
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-lg);
      text-align: center;
    }
    
    .password-text {
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 1.5rem;
      color: var(--color-text);
      word-break: break-all;
      margin-bottom: var(--spacing-md);
      min-height: 2rem;
      letter-spacing: 2px;
    }
    
    .password-strength {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-md);
    }
    
    .strength-bar {
      width: 100px;
      height: 8px;
      background: var(--color-bg-dark);
      border-radius: 4px;
      overflow: hidden;
    }
    
    .strength-fill {
      height: 100%;
      transition: all 0.3s;
    }
    
    .strength-fill.weak { width: 33%; background: #ff4757; }
    .strength-fill.medium { width: 66%; background: #ffa502; }
    .strength-fill.strong { width: 100%; background: #2ed573; }
    
    .strength-text {
      font-size: 0.75rem;
      color: var(--color-text-dim);
    }
    
    .password-actions {
      display: flex;
      justify-content: center;
      gap: var(--spacing-md);
    }
    
    .action-btn {
      background: var(--color-accent);
      color: white;
      border: none;
      padding: var(--spacing-sm) var(--spacing-lg);
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
    }
    
    .action-btn:hover {
      background: var(--color-accent-hover);
      transform: translateY(-2px);
    }
    
    .action-btn.secondary {
      background: var(--color-bg-panel);
      border: 2px solid var(--color-card-border);
      color: var(--color-text);
    }
    
    .action-btn.secondary:hover {
      background: var(--color-card-border);
    }
    
    .settings-panel {
      background: var(--color-bg-panel);
      border: 2px solid var(--color-card-border);
      border-radius: var(--radius-md);
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-lg);
    }
    
    .setting-item {
      margin-bottom: var(--spacing-md);
    }
    
    .setting-item:last-child {
      margin-bottom: 0;
    }
    
    .setting-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-sm);
      font-size: 0.875rem;
      color: var(--color-text);
    }
    
    .setting-value {
      color: var(--color-accent);
      font-weight: bold;
    }
    
    .length-slider {
      width: 100%;
      height: 8px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--color-bg-dark);
      border-radius: 4px;
      outline: none;
    }
    
    .length-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      background: var(--color-accent);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: var(--shadow-pixel);
    }
    
    .length-slider::-moz-range-thumb {
      width: 20px;
      height: 20px;
      background: var(--color-accent);
      border-radius: 50%;
      cursor: pointer;
      border: none;
      box-shadow: var(--shadow-pixel);
    }
    
    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--spacing-sm);
    }
    
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: var(--spacing-sm);
      background: var(--color-bg-dark);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .checkbox-item:hover {
      background: var(--color-card-border);
    }
    
    .checkbox-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--color-accent);
      cursor: pointer;
    }
    
    .checkbox-item label {
      font-size: 0.875rem;
      color: var(--color-text);
      cursor: pointer;
      flex: 1;
    }
    
    .history-panel {
      background: var(--color-bg-panel);
      border: 2px solid var(--color-card-border);
      border-radius: var(--radius-md);
      padding: var(--spacing-lg);
    }
    
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-md);
    }
    
    .history-title {
      font-size: 0.875rem;
      color: var(--color-text);
    }
    
    .clear-btn {
      background: none;
      border: none;
      color: var(--color-text-dim);
      font-size: 0.75rem;
      cursor: pointer;
      transition: color 0.2s;
    }
    
    .clear-btn:hover {
      color: var(--color-error);
    }
    
    .history-list {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
      max-height: 200px;
      overflow-y: auto;
    }
    
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--spacing-sm);
      background: var(--color-bg-dark);
      border-radius: var(--radius-sm);
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.875rem;
    }
    
    .history-password {
      color: var(--color-text);
      word-break: break-all;
      flex: 1;
      margin-right: var(--spacing-sm);
    }
    
    .history-time {
      font-size: 0.75rem;
      color: var(--color-text-dim);
      white-space: nowrap;
    }
    
    .empty-history {
      text-align: center;
      color: var(--color-text-dim);
      font-size: 0.875rem;
      padding: var(--spacing-md);
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="avatar-container" id="avatarContainer">
          <img src="images/avatar.png" alt="头像" class="avatar" id="avatarImg" onerror="this.style.display='none'">
        </div>
        <nav class="nav-menu">
          <a href="index.html" class="nav-item">📝 文章</a>
          <a href="aigc.html" class="nav-item">🎨 AIGC</a>
          <a href="aivideo.html" class="nav-item">📹 AIVideo</a>
          <a href="bookmarks.html" class="nav-item">🔖 书签</a>
          <a href="tools.html" class="nav-item active">🛠️ 工具箱</a>
        </nav>
        <h1 class="site-title">工具箱</h1>
        <p class="site-subtitle">密码生成器</p>
      </div>

      <div class="about-section">
        <h3 class="sidebar-title">关于</h3>
        <p class="about-text">生成高强度随机密码</p>
      </div>

      <footer class="sidebar-footer">
        <p>&copy; 2026 我的个人博客</p>
      </footer>
    </aside>

    <main class="main-content">
      <header class="content-header">
        <h2 class="content-title">🔒 密码生成器</h2>
        <a href="tools.html" class="back-link">← 返回工具箱</a>
      </header>

      <div class="tool-container">
        <div class="tool-header">
          <h2 class="tool-title">🔒 密码生成器</h2>
          <p class="tool-subtitle">生成高强度随机密码，支持自定义长度和字符类型</p>
        </div>

        <div class="password-display">
          <div class="password-text" id="passwordText">点击生成按钮</div>
          <div class="password-strength" id="passwordStrength" style="display: none;">
            <div class="strength-bar">
              <div class="strength-fill" id="strengthFill"></div>
            </div>
            <span class="strength-text" id="strengthText">-</span>
          </div>
          <div class="password-actions">
            <button class="action-btn" onclick="generatePassword()">
              🎲 生成密码
            </button>
            <button class="action-btn secondary" onclick="copyPassword()">
              📋 复制
            </button>
          </div>
        </div>

        <div class="settings-panel">
          <div class="setting-item">
            <div class="setting-label">
              <span>密码长度</span>
              <span class="setting-value" id="lengthValue">16</span>
            </div>
            <input type="range" class="length-slider" id="lengthSlider" min="4" max="64" value="16">
          </div>

          <div class="setting-item">
            <div class="setting-label">
              <span>字符类型</span>
            </div>
            <div class="checkbox-group">
              <div class="checkbox-item">
                <input type="checkbox" id="uppercase" checked>
                <label for="uppercase">大写字母 (A-Z)</label>
              </div>
              <div class="checkbox-item">
                <input type="checkbox" id="lowercase" checked>
                <label for="lowercase">小写字母 (a-z)</label>
              </div>
              <div class="checkbox-item">
                <input type="checkbox" id="numbers" checked>
                <label for="numbers">数字 (0-9)</label>
              </div>
              <div class="checkbox-item">
                <input type="checkbox" id="symbols">
                <label for="symbols">特殊符号 (!@#$...)</label>
              </div>
            </div>
          </div>
        </div>

        <div class="history-panel">
          <div class="history-header">
            <span class="history-title">生成历史</span>
            <button class="clear-btn" onclick="clearHistory()">清空</button>
          </div>
          <div class="history-list" id="historyList">
            <div class="empty-history">暂无历史记录</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    const passwordText = document.getElementById('passwordText');
    const passwordStrength = document.getElementById('passwordStrength');
    const strengthFill = document.getElementById('strengthFill');
    const strengthText = document.getElementById('strengthText');
    const lengthSlider = document.getElementById('lengthSlider');
    const lengthValue = document.getElementById('lengthValue');
    const historyList = document.getElementById('historyList');

    let passwordHistory = [];

    // 更新长度显示
    lengthSlider.addEventListener('input', (e) => {
      lengthValue.textContent = e.target.value;
    });

    // 生成密码
    function generatePassword() {
      const length = parseInt(lengthSlider.value);
      const useUppercase = document.getElementById('uppercase').checked;
      const useLowercase = document.getElementById('lowercase').checked;
      const useNumbers = document.getElementById('numbers').checked;
      const useSymbols = document.getElementById('symbols').checked;

      // 构建字符集
      let charset = '';
      if (useUppercase) charset += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      if (useLowercase) charset += 'abcdefghijklmnopqrstuvwxyz';
      if (useNumbers) charset += '0123456789';
      if (useSymbols) charset += '!@#$%^&*()_+-=[]{}|;:,.<>?';

      if (charset === '') {
        passwordText.textContent = '请至少选择一种字符类型';
        passwordStrength.style.display = 'none';
        return;
      }

      // 生成密码
      let password = '';
      const array = new Uint32Array(length);
      crypto.getRandomValues(array);
      
      for (let i = 0; i < length; i++) {
        password += charset[array[i] % charset.length];
      }

      // 显示密码
      passwordText.textContent = password;
      
      // 计算并显示强度
      const strength = calculateStrength(password);
      showStrength(strength);
      
      // 添加到历史
      addToHistory(password);
    }

    // 计算密码强度
    function calculateStrength(password) {
      let score = 0;
      
      // 长度评分
      if (password.length >= 8) score += 1;
      if (password.length >= 12) score += 1;
      if (password.length >= 16) score += 1;
      
      // 字符类型评分
      if (/[a-z]/.test(password)) score += 1;
      if (/[A-Z]/.test(password)) score += 1;
      if (/[0-9]/.test(password)) score += 1;
      if (/[^a-zA-Z0-9]/.test(password)) score += 1;
      
      return score;
    }

    // 显示强度
    function showStrength(score) {
      passwordStrength.style.display = 'flex';
      strengthFill.className = 'strength-fill';
      
      if (score <= 3) {
        strengthFill.classList.add('weak');
        strengthText.textContent = '弱';
        strengthText.style.color = '#ff4757';
      } else if (score <= 5) {
        strengthFill.classList.add('medium');
        strengthText.textContent = '中等';
        strengthText.style.color = '#ffa502';
      } else {
        strengthFill.classList.add('strong');
        strengthText.textContent = '强';
        strengthText.style.color = '#2ed573';
      }
    }

    // 复制密码
    async function copyPassword() {
      const password = passwordText.textContent;
      if (!password || password === '点击生成按钮' || password === '请至少选择一种字符类型') {
        return;
      }

      try {
        await navigator.clipboard.writeText(password);
        const btn = event.target;
        const originalText = btn.textContent;
        btn.textContent = '已复制';
        setTimeout(() => {
          btn.textContent = originalText;
        }, 2000);
      } catch (err) {
        console.error('复制失败:', err);
      }
    }

    // 添加到历史
    function addToHistory(password) {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      
      passwordHistory.unshift({ password, time: timeStr });
      if (passwordHistory.length > 10) {
        passwordHistory.pop();
      }
      
      renderHistory();
    }

    // 渲染历史
    function renderHistory() {
      if (passwordHistory.length === 0) {
        historyList.innerHTML = '<div class="empty-history">暂无历史记录</div>';
        return;
      }

      historyList.innerHTML = passwordHistory.map(item => `
        <div class="history-item">
          <span class="history-password">${item.password}</span>
          <span class="history-time">${item.time}</span>
        </div>
      `).join('');
    }

    // 清空历史
    function clearHistory() {
      passwordHistory = [];
      renderHistory();
    }

    // 页面加载时生成一个密码
    generatePassword();
  </script>
</body>
</html>
