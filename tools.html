<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具箱 - 我的个人博客</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="avatar-container" id="avatarContainer">
          <img src="images/avatar.png" alt="头像" class="avatar" id="avatarImg" onerror="this.style.display='none'">
        </div>
        <nav class="nav-menu">
          <a href="index.html" class="nav-item">📝 文章</a>
          <a href="aigc.html" class="nav-item">🎨 AIGC</a>
          <a href="aivideo.html" class="nav-item">📹 AIVideo</a>
          <a href="bookmarks.html" class="nav-item">🔖 书签</a>
          <a href="tools.html" class="nav-item active">🛠️ 工具箱</a>
        </nav>
        <h1 class="site-title">工具箱</h1>
        <p class="site-subtitle">实用小工具集合</p>
      </div>

      <div class="about-section">
        <h3 class="sidebar-title">关于</h3>
        <p class="about-text">作者简单自制实用的在线小工具</p>
        <div class="stats">
          <div class="stat-item">
            <span class="stat-number" id="toolCount">1</span>
            <span class="stat-label">工具</span>
          </div>
        </div>
      </div>

      <footer class="sidebar-footer">
        <p>&copy; 2026 我的个人博客</p>
      </footer>
    </aside>

    <main class="main-content">
      <header class="content-header">
        <h2 class="content-title">全部工具</h2>
        <span class="content-count" id="contentCount">1 个</span>
      </header>

      <section class="tools-grid" id="toolsList">
        <a href="image-splitter.html" class="tool-card">
          <div class="tool-icon">✂️</div>
          <h3 class="tool-name">图片分割器</h3>
          <p class="tool-desc">将图片轻松分割成多个小图块，支持批量处理和自定义命名规则</p>
          <div class="tool-tags">
            <span class="tool-tag">图片处理</span>
            <span class="tool-tag">批量处理</span>
          </div>
        </a>
      </section>
    </main>
  </div>

  <aside class="profile-modal" id="profileModal">
    <div class="profile-content">
      <button class="profile-close-btn" id="profileCloseBtn">✕</button>
      <div class="profile-header">
        <div class="profile-title">角色档案</div>
        <div class="profile-subtitle">CHARACTER PROFILE</div>
      </div>
      <div class="profile-body">
        <div class="profile-left">
          <div class="data-line" id="line1"></div>
          <div class="data-line" id="line2"></div>
          <div class="data-line" id="line3"></div>
          <div class="data-line" id="line4"></div>
          <div class="info-item" data-label="昵称">Sparta-Silence</div>
          <div class="info-item" data-label="性别">男</div>
          <div class="info-item" data-label="年龄">23岁</div>
          <div class="info-item" data-label="生日">5月1日</div>
        </div>
        <div class="profile-center">
          <div class="avatar-frame">
            <div class="avatar-glow"></div>
            <img src="images/avatar.png" alt="头像" class="profile-avatar">
          </div>
          <div class="avatar-decoration"></div>
        </div>
        <div class="profile-right">
          <div class="data-line" id="line5"></div>
          <div class="data-line" id="line6"></div>
          <div class="data-line" id="line7"></div>
          <div class="data-line" id="line8"></div>
          <div class="info-item" data-label="邮箱">3291614511@qq.com</div>
          <div class="info-item" data-label="GitHub">暂无</div>
          <div class="info-item" data-label="专业">软件工程</div>
          <div class="info-item" data-label="兴趣">听歌、打游戏</div>
        </div>
      </div>
      <div class="profile-footer">
        <div class="pixel-decoration">◆ ◆ ◆</div>
      </div>
    </div>
  </aside>

  <script src="js/app.js"></script>
</body>
</html>
